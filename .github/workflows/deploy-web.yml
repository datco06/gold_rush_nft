name: Deploy Web Game to Firebase Hosting (CD)

on:
  push:
    branches: [ main ]
    paths:
      - 'gold_rush/**'
      - 'firebase.json'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy Flutter Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cài đặt Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cài đặt Flutter dependencies
        run: |
          cd gold_rush
          flutter pub get

      - name: Biên dịch Flutter Web Release
        run: |
          cd gold_rush
          flutter build web --release --dart-define=GOLD_RUSH_API=https://gold-rush-api.onrender.com

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cài đặt Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy lên Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -n "$FIREBASE_TOKEN" ]; then
            firebase deploy --only hosting --token "$FIREBASE_TOKEN" --non-interactive
          else
            echo "::warning::Chưa cấu hình Secret FIREBASE_TOKEN trong Settings -> Secrets của GitHub Repository. Bỏ qua bước deploy thực tế."
          fi
