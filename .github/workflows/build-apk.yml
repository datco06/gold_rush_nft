name: Build & Release Android APK (CD)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
    paths:
      - 'gold_rush/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cài đặt Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cài đặt Flutter dependencies
        run: |
          cd gold_rush
          flutter pub get

      - name: Biên dịch Android APK Release
        run: |
          cd gold_rush
          flutter build apk --release --dart-define=GOLD_RUSH_API=https://gold-rush-api.onrender.com

      - name: Đổi tên file APK tiện tải về
        run: |
          cp gold_rush/build/app/outputs/flutter-apk/app-release.apk gold_rush/build/app/outputs/flutter-apk/GoldRush-release.apk

      - name: Upload file APK lên GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GoldRush-Android-APK
          path: gold_rush/build/app/outputs/flutter-apk/GoldRush-release.apk
          retention-days: 30

      - name: Tạo GitHub Release (khi gắn tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: gold_rush/build/app/outputs/flutter-apk/GoldRush-release.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
