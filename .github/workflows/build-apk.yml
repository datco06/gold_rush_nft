name: Build & Release Android APK (CD)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
    paths:
      - 'gold_rush/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cài đặt Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cài đặt Flutter dependencies
        run: |
          cd gold_rush
          flutter pub get

      - name: Biên dịch Android APK Release
        shell: bash
        env:
          GOLD_RUSH_ALLOW_DEBUG_SIGNING: ${{ github.ref_type != 'tag' }}
          GOLD_RUSH_RELEASE_KEYSTORE_BASE64: ${{ secrets.GOLD_RUSH_RELEASE_KEYSTORE_BASE64 }}
          GOLD_RUSH_RELEASE_STORE_PASSWORD: ${{ secrets.GOLD_RUSH_RELEASE_STORE_PASSWORD }}
          GOLD_RUSH_RELEASE_KEY_ALIAS: ${{ secrets.GOLD_RUSH_RELEASE_KEY_ALIAS }}
          GOLD_RUSH_RELEASE_KEY_PASSWORD: ${{ secrets.GOLD_RUSH_RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -n "$GOLD_RUSH_RELEASE_KEYSTORE_BASE64" ]]; then
            umask 077
            export GOLD_RUSH_RELEASE_STORE_FILE="$(mktemp "$RUNNER_TEMP/gold-rush-release.XXXXXX.jks")"
            trap 'rm -f -- "$GOLD_RUSH_RELEASE_STORE_FILE"' EXIT
            printf '%s' "$GOLD_RUSH_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$GOLD_RUSH_RELEASE_STORE_FILE"
            unset GOLD_RUSH_RELEASE_KEYSTORE_BASE64
          fi
          cd gold_rush
          flutter build apk --release --dart-define=GOLD_RUSH_API=https://gold-rush-api.onrender.com

      - name: Đổi tên file APK tiện tải về
        run: |
          cp gold_rush/build/app/outputs/flutter-apk/app-release.apk gold_rush/build/app/outputs/flutter-apk/GoldRush-release.apk

      - name: Upload file APK lên GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GoldRush-Android-APK
          path: gold_rush/build/app/outputs/flutter-apk/GoldRush-release.apk
          retention-days: 30

      - name: Tạo GitHub Release (khi gắn tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: gold_rush/build/app/outputs/flutter-apk/GoldRush-release.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
