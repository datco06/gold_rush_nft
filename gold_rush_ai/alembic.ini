# Gold Rush Auth - Alembic 1.20.1.
# Run the CLI from gold_rush_ai; paths are anchored to this INI file.
# env.py and version scripts are not available yet.
# Keep this file ASCII-compatible: Alembic reads INI using the locale encoding.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os
output_encoding = utf-8
revision_environment = false

# Intentionally omit sqlalchemy.url, including example or fallback URLs.
# migrations/env.py must read AUTH_DATABASE_URL at runtime, directly from the
# environment or through AuthConfig.database_url, and pass the URL/Engine on.
# Prefer passing it directly to avoid ConfigParser interpolation of percent signs.
# Never log URLs/credentials; use echo=False and hide_parameters=True on engines.
# env.py must also sanitize connection errors before displaying them.
# target_metadata, custom type rendering and SQLite batch options belong in
# env.py; this INI does not fix the dialect to SQLite or PostgreSQL.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console,null

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

# Suppress SQL/pool/parameter logs, including warnings and errors.
# NullHandler prevents lastResort output while propagation is disabled.
[logger_sqlalchemy]
level = WARNING
handlers = null
qualname = sqlalchemy
propagate = 0

[logger_alembic]
level = INFO
handlers = console
qualname = alembic
propagate = 0

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = INFO
formatter = generic

[handler_null]
class = NullHandler
args = ()

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
